name: CI

on:
  push:
    branches: [project-crm]
  pull_request:
    branches: [gen]

jobs:
  backend:
    name: Backend — Type-check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/crm/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: projects/crm/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Run tests (if any)
        run: |
          if npx vitest --version > /dev/null 2>&1 && [ -n "$(find src -name '*.test.ts' -o -name '*.spec.ts' 2>/dev/null)" ]; then
            npx vitest run
          else
            echo "No test files found — skipping vitest"
          fi

  frontend:
    name: Frontend — Type-check & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/crm/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: projects/crm/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (tsc -b --noEmit)
        run: npx tsc -b --noEmit

      - name: Run tests
        run: npx vitest run
